name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.12.0 = declared engines minimum; 24 = current LTS
        node-version: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Enforce exact dependency versions
        run: node scripts/check-exact-versions.mjs

      - name: Verify engines contract against dependencies
        run: node scripts/check-engines.mjs

      - name: Lint & format
        run: npx biome ci .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Terraform (for HCL validation tests)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Smoke test built CLI
        run: node dist/bin.js --help

      - name: Audit dependencies (high+)
        run: npx audit-ci --audit-level=high

  scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan lockfile & source
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --recursive
            ./
