name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish · GitHub Release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Read package version
        id: release
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install (locked)
        run: npm ci

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Quality and Terraform verification
        run: npm run ci && npm run test:terraform

      - name: Publish to npm
        run: |
          if npm view "@archbaer/dodeploy@${{ steps.release.outputs.version }}" version; then
            echo "Version already exists on npm; skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@archbaer'

      - name: Publish to GitHub Packages
        run: |
          if npm view "@archbaer/dodeploy@${{ steps.release.outputs.version }}" --registry=https://npm.pkg.github.com version; then
            echo "Version already exists on GitHub Packages; skipping publish."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        run: |
          if gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release already exists; skipping creation."
          else
            gh release create "${{ steps.release.outputs.tag }}" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
