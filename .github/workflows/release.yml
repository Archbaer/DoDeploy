name: release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC trusted publishing + npm provenance
  contents: write # GitHub Release

jobs:
  publish:
    name: Gate · Publish · Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install (locked)
        run: npm ci

      - name: Install Terraform (for HCL validation tests)
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Full quality gate
        run: npm run ci

      - name: Smoke test built CLI
        run: node dist/bin.js --help

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # First publish uses a token; switch to OIDC trusted publishing once
          # the package exists on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publish
        # The registry can take minutes to index a fresh package — poll instead
        # of failing on the first 404.
        run: |
          for i in $(seq 1 15); do
            npm view @archbaer/dodeploy version && exit 0
            sleep 20
          done
          echo "package did not appear on the registry within 5 minutes" >&2
          exit 1

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
