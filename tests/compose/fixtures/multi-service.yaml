name: large-stack
services:
  web: { image: nginx:1.27, ports: ["8080:80"] }
  api: { image: ghcr.io/example/api:1.0, ports: ["8081:8080"], depends_on: [pg, cache] }
  worker: { image: ghcr.io/example/api:1.0, command: ["node", "worker.js"], depends_on: [pg, cache] }
  scheduler: { image: ghcr.io/example/api:1.0, command: ["node", "schedule.js"] }
  admin: { image: nginx:1.27, ports: ["8082:80"] }
  metrics: { image: prom/prometheus:v2.53 }
  proxy: { image: nginx:1.27, ports: ["8083:80"] }
  reports: { image: ghcr.io/example/reports:1.0 }
  pg: { image: postgres:16 }
  cache: { image: redis:7 }
  blob: { image: minio/minio:RELEASE.2024-07-16T23-46-41Z }
